# ===========================================================================
# Configuracion exclusiva de las pruebas (perfil "test")
#
# Sustituye PostgreSQL por H2, una base en memoria. Gracias a esto "mvn test"
# funciona en cualquier maquina sin instalar ni configurar nada: no depende de
# que exista fidelidad_db ni de la contrasena del usuario postgres.
#
# Se activa con @ActiveProfiles("test") en cada clase de prueba, que tiene
# prioridad sobre el spring.profiles.active=local de application.properties.
# ===========================================================================

# MODE=PostgreSQL hace que H2 acepte la misma sintaxis que usa la aplicacion.
# DB_CLOSE_DELAY=-1 mantiene viva la base mientras dure la JVM de las pruebas.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cada ejecucion crea el esquema desde las entidades y lo destruye al terminar,
# de modo que ninguna prueba hereda datos de otra.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# data.sql usa sintaxis propia de PostgreSQL (ON CONFLICT, pg_get_serial_sequence),
# que H2 no entiende. Las pruebas crean sus propios datos, asi que no se carga.
spring.sql.init.mode=never
