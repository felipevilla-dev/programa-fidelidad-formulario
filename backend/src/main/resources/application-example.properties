# ===========================================================================
# Plantilla de configuracion - Programa de Fidelidad
#
# Este archivo es solo una REFERENCIA de que se puede configurar. La aplicacion
# NO lo lee: el que se carga es application.properties, que ya viene en el
# repositorio y toma cada valor de una variable de entorno.
#
# Es decir, no hace falta copiar este archivo para arrancar el proyecto. Basta
# con definir las variables de entorno que quieras cambiar; las que no definas
# usan el valor por defecto de desarrollo local.
#
# En Windows (PowerShell), para la sesion actual:
#   $env:DB_PASSWORD = "tu_password"
#
# De forma permanente, para terminales nuevas:
#   setx DB_PASSWORD "tu_password"
#
# En Linux o macOS:
#   export DB_PASSWORD=tu_password
# ===========================================================================

# ---------------------------------------------------------------------------
# Conexion a PostgreSQL
#
# La base debe existir previamente:  CREATE DATABASE fidelidad_db;
# ---------------------------------------------------------------------------
# Variable: DB_HOST      (por defecto: localhost)
# Variable: DB_PORT      (por defecto: 5432)
# Variable: DB_NAME      (por defecto: fidelidad_db)
spring.datasource.url=jdbc:postgresql://localhost:5432/fidelidad_db

# Variable: DB_USER      (por defecto: postgres)
spring.datasource.username=

# Variable: DB_PASSWORD  (por defecto: postgres)
#
# NUNCA escribas aqui la contrasena real: este archivo se versiona en Git.
# Usa la variable de entorno.
spring.datasource.password=

# ---------------------------------------------------------------------------
# Servidor
# ---------------------------------------------------------------------------
# Variable: SERVER_PORT  (por defecto: 8080)
server.port=8080

# ---------------------------------------------------------------------------
# CORS: origenes autorizados a llamar a la API desde un navegador
#
# Varios se separan por coma. Debe coincidir con la direccion del frontend.
# ---------------------------------------------------------------------------
# Variable: CORS_ALLOWED_ORIGINS  (por defecto: http://localhost:5173)
app.cors.allowed-origins=http://localhost:5173
