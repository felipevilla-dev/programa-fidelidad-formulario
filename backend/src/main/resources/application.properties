# ===========================================================================
# Configuracion de la aplicacion - Programa de Fidelidad
#
# La sintaxis ${VARIABLE:valor_por_defecto} toma el valor de una variable de
# entorno y, si no existe, usa el valor por defecto de desarrollo local. Asi
# ninguna credencial real queda escrita en el repositorio.
# ===========================================================================
spring.application.name=programa-fidelidad
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Conexion a PostgreSQL
# La base de datos debe existir previamente: CREATE DATABASE fidelidad_db;
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fidelidad_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=update: Hibernate crea y actualiza las tablas a partir de las clases
# @Entity. Comodo para desarrollo; en produccion se prefiere una herramienta de
# migraciones como Flyway o Liquibase, que versiona los cambios de esquema.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Inicializacion de datos (src/main/resources/data.sql)
#
# defer-datasource-initialization=true es obligatorio aqui: desde Spring Boot
# 2.5, data.sql se ejecuta ANTES de que Hibernate cree las tablas, asi que sin
# esta propiedad fallaria con "relation does not exist". Al activarla, el orden
# pasa a ser: DDL de Hibernate -> data.sql.
#
# data.sql corre en cada arranque, por eso sus INSERT usan ON CONFLICT DO
# NOTHING y el script es idempotente.
# ---------------------------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# ---------------------------------------------------------------------------
# CORS: origenes autorizados a llamar a la API desde un navegador
#
# El navegador bloquea las peticiones entre origenes distintos. localhost:5173
# (React con Vite) y localhost:8080 (esta API) son origenes distintos, asi que sin
# esta lista el formulario recibiria un error de CORS. Con curl no se nota, porque
# la restriccion la impone el navegador y no el servidor.
#
# Se pueden indicar varios separados por coma.
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
